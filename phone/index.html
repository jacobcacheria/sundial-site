<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sundial — prototype</title>
<style>
  :root{
    --linen:#FBF4E6;
    --honey:#F2B95C;
    --amber:#E08A4C;
    --blush:#F4C2A8;
    --cocoa:#5A4534;
    --cocoa-soft:#8a7561;
    --seafoam:#9CC4BC;
    --seafoam-deep:#5f9085;
    --dusk:#2A2118;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%;}
  body{
    font-family:-apple-system,"SF Pro Rounded","Nunito",system-ui,sans-serif;
    background:transparent;            /* embedded in the site via <iframe> */
    display:block; margin:0; padding:7px; color:var(--cocoa);
  }
  .serif{font-family:"Iowan Old Style","Palatino Linotype",Georgia,"Times New Roman",serif;}

  /* ---------- phone frame ---------- */
  .phone{
    position:relative; width:380px; height:800px;
    background:#000; border-radius:54px; padding:13px;
    box-shadow:inset 0 0 0 2px #2a2a2a;
  }
  .screen{
    position:relative; width:100%; height:100%;
    border-radius:42px; overflow:hidden; background:var(--linen);
  }
  .island{
    position:absolute; top:25px; left:50%; transform:translateX(-50%);
    width:118px; height:33px; background:#000; border-radius:20px; z-index:50;
  }

  /* physical side buttons (non-functional, cosmetic) */
  .side-btn{ position:absolute; z-index:3;
    background:linear-gradient(180deg,#2c2c2e 0%,#161618 55%,#070708 100%);
    box-shadow:0 1px 2px rgba(0,0,0,.45), inset 0 1px 1px rgba(255,255,255,.12); }
  .btn-vol-up, .btn-vol-down{ left:-4px; width:5px; height:58px; border-radius:3px 0 0 3px; }
  .btn-vol-up{ top:170px; }
  .btn-vol-down{ top:238px; }
  .btn-power{ right:-4px; width:5px; height:100px; top:198px; border-radius:0 3px 3px 0; }
  .statusbar{
    position:absolute; top:0; left:0; right:0; height:54px; z-index:40;
    display:flex; align-items:center; justify-content:space-between;
    padding:20px 28px 0; font-size:15px; font-weight:700; color:#3a2e22;
  }
  .statusbar.light{color:#fff;}
  .sb-time{letter-spacing:.5px;}
  .sb-right{display:flex; align-items:center; gap:6px;}
  .sb-right svg{display:block;}

  /* ---------- view system ---------- */
  .view{position:absolute; inset:0; opacity:0; pointer-events:none; transition:opacity .35s ease, transform .35s ease; transform:scale(1.04);}
  .view.active{opacity:1; pointer-events:auto; transform:scale(1);}

  /* ---------- HOME SCREEN ---------- */
  #home{
    background:
      radial-gradient(120% 80% at 50% 0%, #ffd79a 0%, #f6b27a 38%, #e58f6e 66%, #b98aa0 100%);
  }
  .home-inner{position:absolute; inset:0; padding:62px 22px 26px; display:flex; flex-direction:column;}
  .home-clock{text-align:center; color:#fff; margin:8px 0 20px; text-shadow:0 2px 12px rgba(120,70,40,.35);}
  .home-clock .h{font-size:74px; font-weight:300; letter-spacing:1px; line-height:1;}
  .home-clock .d{font-size:15px; font-weight:600; opacity:.95; margin-top:4px;}

  /* the Sundial widget */
  .widget{
    background:linear-gradient(165deg,#fffaf0 0%,#fdeccf 100%);
    border-radius:26px; padding:16px 17px 14px;
    box-shadow:0 18px 34px -12px rgba(120,70,40,.5), inset 0 0 0 1px rgba(255,255,255,.6);
    cursor:pointer; transition:transform .15s ease; position:relative; overflow:hidden;
  }
  .widget:active{transform:scale(.97);}
  .widget::after{
    content:""; position:absolute; inset:0; opacity:.05; pointer-events:none;
    background-image:radial-gradient(circle at 20% 30%, #5a4534 1px, transparent 1px), radial-gradient(circle at 70% 60%, #5a4534 1px, transparent 1px);
    background-size:9px 9px,13px 13px;
  }
  .w-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:9px;}
  .w-brand{display:flex; align-items:center; gap:7px; font-weight:800; font-size:13px; color:var(--amber); letter-spacing:.2px;}
  .w-sun{width:18px;height:18px;border-radius:50%;background:
      radial-gradient(circle at 50% 50%, #f7c870 0%, #ef9f44 52%, transparent 53%),
      radial-gradient(circle at 50% 50%, #faecc8 0%, #faecc8 100%);}
  .w-date{font-size:11px; font-weight:700; color:var(--cocoa-soft);}
  .w-beam{font-size:10.5px; color:var(--cocoa-soft); margin-bottom:9px;}
  .w-beam b{color:var(--seafoam-deep);}
  .w-beam .a{color:var(--amber);}
  .w-rays{display:flex; flex-direction:column; gap:7px;}
  .w-ray{display:flex; gap:8px; font-size:11.5px; line-height:1.3;}
  .w-ray .t{font-variant-numeric:tabular-nums; font-weight:700; font-size:9.5px; color:var(--cocoa-soft); padding-top:1px; min-width:52px;}
  .w-ray .x{color:var(--cocoa); border-left:2px solid var(--honey); padding-left:7px;}
  /* messages populate the widget: msg1 fades in first, msg2 a bit later,
     both hold, then both fade out together and loop (same 9s cycle). */
  .w-ray.pop1{ animation: pop1 13s ease-in-out infinite; }
  .w-ray.pop2{ animation: pop2 13s ease-in-out infinite; }
  @keyframes pop1{
    0%   { opacity:0; transform:translateY(5px); }
    15%  { opacity:1; transform:translateY(0); }   /* in by ~2s */
    85%  { opacity:1; transform:translateY(0); }   /* hold */
    92%  { opacity:0; transform:translateY(5px); } /* out by ~12s */
    100% { opacity:0; transform:translateY(5px); }
  }
  @keyframes pop2{
    0%   { opacity:0; transform:translateY(5px); }
    31%  { opacity:0; transform:translateY(5px); } /* wait ~4s, staggered */
    46%  { opacity:1; transform:translateY(0); }   /* in by ~6s */
    85%  { opacity:1; transform:translateY(0); }   /* hold */
    92%  { opacity:0; transform:translateY(5px); } /* out at the SAME time as msg1 */
    100% { opacity:0; transform:translateY(5px); }
  }
  .w-tap{text-align:center; font-size:9.5px; color:var(--cocoa-soft); margin-top:11px; opacity:.85;}

  /* ---------- HOME ICONS (realistic) ---------- */
  .home-icons{display:grid; grid-template-columns:repeat(4,1fr); gap:22px 16px; margin-top:30px;}
  .app-ic{display:flex; flex-direction:column; align-items:center; gap:6px;}
  .app-ic .sq{
    width:60px;height:60px;border-radius:14px;overflow:hidden;position:relative;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 14px rgba(120,70,40,.22);
  }
  .app-ic .sq svg{width:62%;height:62%;}
  .app-ic .nm{font-size:11px;color:#fff;text-shadow:0 1px 4px rgba(120,70,40,.45);}
  .sq img{width:100%;height:100%;object-fit:cover;display:block;}

  .home-dock{margin-top:auto; background:rgba(255,255,255,.20); backdrop-filter:blur(12px); border-radius:30px; padding:13px; display:flex; justify-content:space-around;}
  .home-dock .sq{
    width:60px;height:60px;border-radius:14px;overflow:hidden;position:relative;
    display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px rgba(120,70,40,.18);
  }
  .home-dock .sq svg{width:62%;height:62%;}

  /* icon backgrounds */
  .ic-phone {background:linear-gradient(180deg,#41e065,#13c138);}
  .ic-msg   {background:linear-gradient(180deg,#5df477,#0ac93b);}
  .ic-safari{background:linear-gradient(180deg,#21a7ff,#0a63f8);}
  .ic-mail  {background:linear-gradient(180deg,#21b4ff,#0a8bff);}
  .ic-camera{background:linear-gradient(180deg,#3d3d40,#19191b);}
  .ic-music {background:linear-gradient(180deg,#fb5c74,#f8233b);}
  .ic-maps  {background:linear-gradient(180deg,#e9f3e2,#d9ead0);}
  .ic-maps svg{width:100%;height:100%;}

  /* ---------- APP ---------- */
  #app{background:var(--linen); display:flex; flex-direction:column;}
  #app::before{
    content:""; position:absolute; inset:0; pointer-events:none; opacity:.04; z-index:0;
    background-image:radial-gradient(circle, #5a4534 1px, transparent 1px); background-size:14px 14px;
  }
  .app-head{position:relative; z-index:2; padding:60px 20px 10px; background:linear-gradient(180deg,#fdeccf 0%,rgba(251,244,230,0) 100%);}
  .app-bar{display:flex; align-items:center; justify-content:space-between;}
  .app-brand{display:flex; align-items:center; gap:8px; font-weight:800; color:var(--amber); font-size:17px;}
  .app-brand .sun{width:20px;height:20px;border-radius:50%;background:
      radial-gradient(circle at 50% 50%, #f7c870 0%, #ef9f44 52%, transparent 53%),
      radial-gradient(circle at 50% 50%, #faecc8 0%, #faecc8 100%);}
  .beam-chip{font-size:11px; font-weight:700; background:#fff; border-radius:20px; padding:5px 11px; box-shadow:0 3px 8px rgba(120,70,40,.12);}
  .beam-chip .y{color:var(--seafoam-deep);} .beam-chip .a{color:var(--amber);}

  .seg{display:flex; background:rgba(90,69,52,.08); border-radius:12px; padding:3px; margin-top:14px;}
  .seg button{flex:1; border:0; background:transparent; font:inherit; font-weight:700; font-size:13px; color:var(--cocoa-soft); padding:7px; border-radius:9px; cursor:pointer; transition:.2s;}
  .seg button.on{background:#fff; color:var(--cocoa); box-shadow:0 2px 6px rgba(120,70,40,.12);}

  .date-hero{position:relative; z-index:2; padding:6px 22px 12px; display:flex; align-items:flex-end; justify-content:space-between;}
  .date-hero .dh-day{font-size:13px; font-weight:700; color:var(--amber); letter-spacing:.5px; text-transform:uppercase;}
  .date-hero .dh-date{font-size:30px; line-height:1.05; color:var(--cocoa);}
  .date-hero .dh-sun{width:40px;height:40px;border-radius:50%;background:
      radial-gradient(circle at 50% 50%, #f7c870 0%, #ef9f44 54%, transparent 55%),
      radial-gradient(circle at 50% 50%, #faecc8 0%, #faecc8 100%);
      box-shadow:0 0 22px rgba(240,160,70,.5);}

  /* rays = notepad lines (received only) */
  .rays{position:relative; z-index:2; flex:1; overflow-y:auto; padding:6px 18px 8px;}
  .ray{display:flex; gap:11px; padding:10px 12px; border-radius:14px; margin-bottom:9px; animation:pop .4s ease;}
  @keyframes pop{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
  .ray .stamp{font-variant-numeric:tabular-nums; font-size:10px; font-weight:800; color:var(--cocoa-soft); padding-top:3px; min-width:74px; letter-spacing:.3px;}
  .ray .body{font-size:14.5px; line-height:1.4; color:var(--cocoa); flex:1;}
  .ray .who{font-size:9.5px; font-weight:800; letter-spacing:.4px; text-transform:uppercase; display:block; margin-bottom:2px;}
  .ray.kimchi{background:linear-gradient(180deg,#fff6e6,#fdeccd); border-left:3px solid var(--honey);}
  .ray.kimchi .who{color:var(--amber);}
  .fresh{text-align:center; color:var(--cocoa-soft); font-size:13px; padding:40px 20px; line-height:1.6;}
  .fresh .big{font-size:34px; display:block; margin-bottom:8px;}

  /* keepsakes */
  .alm-card{position:relative; z-index:2; background:#fff; border-radius:16px; padding:14px 16px; margin:0 18px 12px; box-shadow:0 6px 16px rgba(120,70,40,.1); cursor:pointer;}
  .alm-card .ad{font-size:12px; font-weight:800; color:var(--amber); text-transform:uppercase; letter-spacing:.4px;}
  .alm-card .ap{font-size:13px; color:var(--cocoa-soft); margin-top:5px; line-height:1.4;}
  .alm-card .acount{font-size:10.5px; color:var(--cocoa-soft); margin-top:7px;}

  /* compose */
  .demo-row{position:relative; z-index:2; display:flex; gap:8px; padding:0 16px 6px; justify-content:center;}
  .demo-btn{font:inherit; font-size:11px; font-weight:700; border:0; cursor:pointer; border-radius:20px; padding:7px 13px; background:rgba(242,185,92,.25); color:var(--amber);}
  .demo-btn.dusk{background:rgba(90,69,52,.1); color:var(--cocoa);}
  .compose{position:relative; z-index:3; display:flex; gap:9px; padding:10px 14px calc(10px + env(safe-area-inset-bottom)); background:linear-gradient(180deg,rgba(251,244,230,0),#fdeccf 40%);}
  .compose input{flex:1; border:0; background:#fff; border-radius:22px; padding:13px 16px; font:inherit; font-size:14.5px; color:var(--cocoa); box-shadow:inset 0 0 0 1px rgba(90,69,52,.12), 0 4px 10px rgba(120,70,40,.08);}
  .compose input::placeholder{color:#b6a591;}
  .compose .send{border:0; cursor:pointer; width:48px; height:48px; border-radius:50%; background:linear-gradient(160deg,var(--seafoam),var(--seafoam-deep)); color:#fff; font-size:20px; box-shadow:0 8px 16px rgba(95,144,133,.45);}
  .compose .send:active{transform:scale(.92);}

  /* toast */
  .toast{position:absolute; bottom:96px; left:50%; transform:translateX(-50%) translateY(20px); z-index:60;
    background:var(--dusk); color:#fdeccf; font-size:12.5px; font-weight:600; padding:11px 18px; border-radius:24px;
    opacity:0; transition:.35s; box-shadow:0 12px 30px rgba(0,0,0,.3); white-space:nowrap;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div class="stage">
<div class="phone">
  <div class="side-btn btn-vol-up"></div>
  <div class="side-btn btn-vol-down"></div>
  <div class="side-btn btn-power"></div>
  <div class="island"></div>
  <div class="screen">

    <!-- ============ HOME SCREEN ============ -->
    <div class="view active" id="home">
      <div class="statusbar light">
        <span class="sb-time" id="sb-home-time">9:41</span>
        <span class="sb-right">
          <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
          <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><path d="M8.5 2.4c2.4 0 4.6.9 6.3 2.5l-1.4 1.5C12 5.1 10.3 4.4 8.5 4.4S5 5.1 3.6 6.4L2.2 4.9C3.9 3.3 6.1 2.4 8.5 2.4zm0 3.5c1.3 0 2.5.5 3.4 1.4l-1.4 1.5c-.5-.5-1.2-.8-2-.8s-1.5.3-2 .8L5.1 7.3c.9-.9 2.1-1.4 3.4-1.4zm0 3.4l1.5 1.5c-.4.4-1 .7-1.5.7s-1.1-.3-1.5-.7l1.5-1.5z"/></svg>
          <svg width="26" height="13" viewBox="0 0 26 13"><rect x="0.5" y="0.5" width="22" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".45"/><rect x="2" y="2" width="17.5" height="9" rx="2" fill="currentColor"/><rect x="23.6" y="4" width="1.8" height="5" rx="1" fill="currentColor" opacity=".5"/></svg>
        </span>
      </div>

      <div class="home-inner">
        <div class="home-clock">
          <div class="h" id="home-h">12:30</div>
          <div class="d serif" id="home-d">Saturday, June 13</div>
        </div>

        <div class="widget" onclick="openApp()">
          <div class="w-top">
            <div class="w-brand"><span class="w-sun"></span> Sundial</div>
            <div class="w-date" id="w-date">Sat · Jun 13</div>
          </div>
          <div class="w-beam">Your Beam · <b>you</b> ☀ <span class="a">kimchi</span></div>
          <div class="w-rays" id="w-rays"></div>
          <div class="w-tap">tap to see the day's rays ›</div>
        </div>

        <div class="home-icons">
          <div class="app-ic"><div class="sq"><img src="sundial-icon.png" alt="Sundial" /></div><div class="nm">Sundial</div></div>
          <div class="app-ic"><div class="sq"><img src="ic-music.png" alt="Music" /></div><div class="nm">Music</div></div>
          <div class="app-ic"><div class="sq"><img src="ic-contacts.png" alt="Contacts" /></div><div class="nm">Contacts</div></div>
        </div>

        <div class="home-dock">
          <div class="sq"><img src="ic-maps.png" alt="Maps" /></div>
          <div class="sq"><img src="ic-messages.png" alt="Messages" /></div>
          <div class="sq"><img src="ic-phone.png" alt="Phone" /></div>
          <div class="sq"><img src="ic-settings.png" alt="Settings" /></div>
        </div>
      </div>
    </div>

    <!-- ============ APP ============ -->
    <div class="view" id="app">
      <div class="statusbar">
        <span class="sb-time" id="sb-app-time">9:41</span>
        <span class="sb-right">
          <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
          <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><path d="M8.5 2.4c2.4 0 4.6.9 6.3 2.5l-1.4 1.5C12 5.1 10.3 4.4 8.5 4.4S5 5.1 3.6 6.4L2.2 4.9C3.9 3.3 6.1 2.4 8.5 2.4zm0 3.5c1.3 0 2.5.5 3.4 1.4l-1.4 1.5c-.5-.5-1.2-.8-2-.8s-1.5.3-2 .8L5.1 7.3c.9-.9 2.1-1.4 3.4-1.4zm0 3.4l1.5 1.5c-.4.4-1 .7-1.5.7s-1.1-.3-1.5-.7l1.5-1.5z"/></svg>
          <svg width="26" height="13" viewBox="0 0 26 13"><rect x="0.5" y="0.5" width="22" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".45"/><rect x="2" y="2" width="17.5" height="9" rx="2" fill="currentColor"/><rect x="23.6" y="4" width="1.8" height="5" rx="1" fill="currentColor" opacity=".5"/></svg>
        </span>
      </div>

      <div class="app-head">
        <div class="app-bar">
          <div class="app-brand"><span class="sun"></span> Sundial</div>
          <div class="beam-chip"><span class="y">you</span> ☀ <span class="a">kimchi</span></div>
        </div>
        <div class="seg">
          <button id="seg-today" class="on" onclick="showTab('today')">Today</button>
          <button id="seg-alm" onclick="showTab('almanac')">Keepsakes</button>
        </div>
      </div>

      <!-- TODAY -->
      <div id="tab-today" style="display:flex; flex-direction:column; flex:1; min-height:0;">
        <div class="date-hero">
          <div>
            <div class="dh-day" id="hero-day">Saturday</div>
            <div class="dh-date serif" id="hero-date">June 13</div>
          </div>
          <div class="dh-sun"></div>
        </div>
        <div class="rays" id="rays"></div>
        <div class="demo-row">
          <button class="demo-btn" onclick="kimchiReplies()">☀️ pretend kimchi sends a ray</button>
        </div>
        <div class="compose">
          <input id="entry" placeholder="leave a ray for kimchi…" onkeydown="if(event.key==='Enter')addMine()" />
          <button class="send" onclick="addMine()">↑</button>
        </div>
      </div>

      <!-- KEEPSAKES -->
      <div id="tab-almanac" style="display:none; flex:1; overflow-y:auto; padding-top:8px;">
        <div id="alm-list"></div>
        <div class="demo-row" style="margin-top:6px;">
          <button class="demo-btn dusk" onclick="goHome()">‹ back to home screen</button>
        </div>
      </div>

      <div class="toast" id="toast"></div>
    </div>

  </div>
</div>
</div>

<script>
  function nowStamp(){
    const d = new Date();
    let h = d.getHours(); const m = String(d.getMinutes()).padStart(2,'0');
    const s = String(d.getSeconds()).padStart(2,'0');
    const ap = h>=12?'PM':'AM'; h = h%12||12;
    return `${h}:${m}:${s} ${ap}`;
  }

  // Today shows ONLY received rays (from kimchi).
  let today = [
    {who:'kimchi', t:'8:14:02 AM',  text:'morning, sunshine ☀️'},
    {who:'kimchi', t:'7:48:21 PM',  text:"let's watch a movie tonight"},
  ];

  let keepsakes = [
    {day:'Friday, June 12', count:14, preview:'couldn\'t stop smiling in my 2pm meeting because of you…'},
    {day:'Thursday, June 11', count:9, preview:'you left me a ray at 2am 🥹 i kept it on my lock screen all day'},
  ];

  const kimchiLines = [
    'okay but come home soon 🥺',
    'the sun came out and i thought of you ☀️',
    'reading your ray over and over in class lol',
    'saving you the good half of the towel 🧡',
    'i love that this lives on my home screen now',
  ];

  function rayHTML(r){
    return `<div class="ray ${r.who}">
      <div class="stamp">${r.t}</div>
      <div class="body"><span class="who">kimchi</span>${r.text}</div>
    </div>`;
  }
  function render(){
    const rays = document.getElementById('rays');
    if(today.length===0){
      rays.innerHTML = `<div class="fresh"><span class="big">🌅</span><b>Your Day is fresh.</b><br>kimchi hasn't sent a ray yet today.</div>`;
    } else {
      rays.innerHTML = today.map(rayHTML).join('');
      rays.scrollTop = rays.scrollHeight;
    }
    // widget mirror — last 2 received rays
    const wr = document.getElementById('w-rays');
    const last = today.slice(-2);
    wr.innerHTML = last.length
      ? last.map((r,i)=>`<div class="w-ray ${i===0?'pop1':'pop2'}"><div class="t">${r.t.replace(/:\d\d /,' ')}</div><div class="x">${r.text}</div></div>`).join('')
      : `<div class="w-ray"><div class="t"></div><div class="x" style="color:#8a7561">a fresh Day awaits ☀️</div></div>`;
    // keepsakes
    document.getElementById('alm-list').innerHTML = keepsakes.map(a=>`
      <div class="alm-card">
        <div class="ad">${a.day}</div>
        <div class="ap">"${a.preview}"</div>
        <div class="acount">☀ ${a.count} rays · tucked away</div>
      </div>`).join('');
  }

  // You send a ray — it goes to kimchi (toast), but this view only shows received rays.
  function addMine(){
    const inp = document.getElementById('entry');
    const v = inp.value.trim(); if(!v) return;
    inp.value=''; toast('Ray sent to kimchi ☀️');
  }
  function kimchiReplies(){
    const line = kimchiLines[Math.floor(Math.random()*kimchiLines.length)];
    today.push({who:'kimchi', t:nowStamp(), text:line});
    render(); toast('🌊 kimchi left you a ray');
  }

  let toastTimer;
  function toast(msg){
    const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2600);
  }

  function showTab(which){
    const t = which==='today';
    document.getElementById('tab-today').style.display = t?'flex':'none';
    document.getElementById('tab-almanac').style.display = t?'none':'flex';
    document.getElementById('seg-today').classList.toggle('on',t);
    document.getElementById('seg-alm').classList.toggle('on',!t);
  }

  function openApp(){ document.getElementById('home').classList.remove('active'); document.getElementById('app').classList.add('active'); showTab('today'); }
  function goHome(){ document.getElementById('app').classList.remove('active'); document.getElementById('home').classList.add('active'); }

  function tick(){
    const d=new Date(); let h=d.getHours(); const m=String(d.getMinutes()).padStart(2,'0');
    const h12=h%12||12;
    document.getElementById('sb-home-time').textContent=`${h12}:${m}`;
    document.getElementById('sb-app-time').textContent=`${h12}:${m}`;
    document.getElementById('home-h').textContent=`${h12}:${m}`;
  }
  setInterval(tick,1000); tick();
  render();
</script>
</body>
</html>
